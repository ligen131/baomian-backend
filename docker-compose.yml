services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baomian
      POSTGRES_USER: baomian
      POSTGRES_PASSWORD: baomian
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baomian -d baomian"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - baomian_postgres:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://baomian:baomian@postgres:5432/baomian?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://baomian:baomian@postgres:5432/baomian?sslmode=disable
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      VOLCENGINE_SPEECH_APP_ID: ${VOLCENGINE_SPEECH_APP_ID:-}
      VOLCENGINE_SPEECH_ACCESS_TOKEN: ${VOLCENGINE_SPEECH_ACCESS_TOKEN:-}
      VOLCENGINE_TTS_API_KEY: ${VOLCENGINE_TTS_API_KEY:-}
      VOLCENGINE_ASR_WS_URL: ${VOLCENGINE_ASR_WS_URL:-wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async}
      VOLCENGINE_ASR_RESOURCE_ID: ${VOLCENGINE_ASR_RESOURCE_ID:-volc.bigasr.sauc.duration}
      VOLCENGINE_TTS_WS_URL: ${VOLCENGINE_TTS_WS_URL:-wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream}
      VOLCENGINE_TTS_RESOURCE_ID: ${VOLCENGINE_TTS_RESOURCE_ID:-seed-tts-2.0}
      VOLCENGINE_TTS_SPEAKER: ${VOLCENGINE_TTS_SPEAKER:-ICL_uranus_zh_female_wenrouwenya_tob}
      CONVERSATION_SILENCE_TIMEOUT: ${CONVERSATION_SILENCE_TIMEOUT:-20s}
      CONVERSATION_MAX_DURATION: ${CONVERSATION_MAX_DURATION:-4m}
      PHONE_REMOVED_RESUME_WINDOW: ${PHONE_REMOVED_RESUME_WINDOW:-10m}
      SESSION_COORDINATOR_INTERVAL: ${SESSION_COORDINATOR_INTERVAL:-1s}
      DEVICE_COMMAND_LEASE: ${DEVICE_COMMAND_LEASE:-30s}
      DEVICE_COMMAND_MAX_ATTEMPTS: ${DEVICE_COMMAND_MAX_ATTEMPTS:-5}
      EXPO_TIME_SCALE: ${EXPO_TIME_SCALE:-1}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  baomian_postgres:
